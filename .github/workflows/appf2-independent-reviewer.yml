name: APPf2 Independent Reviewer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: read

jobs:
  review:
    if: >-
      github.event.issue.number == 137 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '[APPF2-RESULT][COMMENT-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Independently audit APPf2 execution result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          APPF2_REPO: ${{ github.repository }}
          APPF2_RESULT_COMMENT_ID: ${{ github.event.comment.id }}
          APPF2_RESULT_BODY: ${{ github.event.comment.body }}
        run: node automation/reviewer/review-result.mjs
