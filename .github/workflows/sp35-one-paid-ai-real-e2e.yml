    timeout-minutes: 35
    env:
      APPF2_SP35_REMAINING_EXPLICIT_PAID_OK: '1'
      APPF2_SP35_SAMPLE: ${{ contains(github.event.head_commit.message, '[SP35-SAMPLE-g6-length]') && 'g6-length' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g7-memory]') && 'g7-memory' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g8-lights]') && 'g8-lights' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g9-connect]') && 'g9-connect' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g10-books]') && 'g10-books' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g11-water]') && 'g11-water' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g12-reading]') && 'g12-reading' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g13-order]') && 'g13-order' || contains(github.event.head_commit.message, '[SP35-SAMPLE-g14-escape]') && 'g14-escape' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frozen selected requirement before one charge
        run: node deploy/scripts/sp35-remaining-native-website-e2e.mjs --preflight-only
      - run: npx playwright install --with-deps chromium
      - name: Exactly one 44c owner Job, Docker Chromium QA and new recipient UI
        run: node deploy/scripts/sp35-remaining-native-website-e2e.mjs

  cancel-empty-g5-prejob:
    # Fixed already-inspected run: its frozen Job has no paid call or generated source; retain the Job.
    # This is cancellation only, never a rerun, model call or replacement Job.
    if: contains(github.event.head_commit.message, '[SP35-G5-CANCEL-EMPTY-PREJOB]')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only the exhausted pre-Job waiter
        env:
          GH_CANCEL_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base="https://api.github.com/repos/NFF98/appf2-build/actions/runs/41327212659";
          const headers={Authorization:"Bearer "+process.env.GH_CANCEL_TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
          const found=await fetch(base,{headers});
          const run=await found.json();
          if(!found.ok||run.head_sha!=="a06d4cd793b383615f638f3ae810aad2286a1bb9")throw Error("FIXED_RUN_MISMATCH");
          if(run.status==="completed"){console.log("EMPTY_PREJOB_ALREADY_FINISHED");process.exit(0);}
          const result=await fetch(base+"/cancel",{method:"POST",headers});
          if(result.status!==202)throw Error("FIXED_RUN_CANCEL_HTTP_"+result.status);
          console.log("EMPTY_PREJOB_CANCEL_REQUESTED_NO_MODEL_NO_NEW_JOB");
          JS

