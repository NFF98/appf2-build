name: Sprint 3.5 ONE bounded real GPT-6 QA/repair chain (76c maximum reservation)
on:
  push:
    branches:
      - product/sprint-3.5-complex-intent-recovery-20261026
    paths:
      - .github/workflows/sp35-one-paid-ai-real-e2e.yml
permissions:
  contents: read
concurrency:
  group: sp35-one-explicit-paid-ai-e2e
  cancel-in-progress: false
jobs:
  once-paid-ai-e2e:
    # Never bill another model call on an ordinary push. One-time marker
    # requires a separate human-authorized commit in addition to this branch.
    if: github.repository == 'NFF98/appf2-build' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026' && contains(github.event.head_commit.message, '[SP35-PAID-AI-ONE-SHOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ONE real OpenAI Responses call → original signed Staging Job → real free Docker + browser QA + saved App
        env:
          APPF2_PAID_AI_E2E_KEY: ${{ secrets.APPF2_OPENAI_AGENT_API_KEY || secrets.APPF2_MODEL_API_KEY || secrets.OPENAI_API_KEY }}
          APPF2_STAGING_URL: https://appf2-sp35-417-staging.juiyuang69.workers.dev
        run: node deploy/scripts/sp35-one-paid-ai-real-e2e.mjs

  g1-dice-multimodule-first-paid-sample:
    # Human 2026-11-01 approval recorded BEFORE spend in the original
    # docs/sprint-3.5/SP35-FIVE-CORE-PRODUCT-CLOSEOUT.md §0.P.2.
    # ONE new owner/Job, total 76c ceiling; never trigger on ordinary push.
    if: github.repository == 'NFF98/appf2-build' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026' && contains(github.event.head_commit.message, '[SP35-G1-PAID-ONE-SHOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free syntax check BEFORE any possible GPT-6 fee
        run: node --check deploy/scripts/sp35-g1-paid-real-dice-e2e.mjs
      - name: Free Staging readiness check; do NOT make any paid call when unavailable
        run: |
          node --input-type=module <<'JS'
          const u="https://appf2-sp35-417-staging.juiyuang69.workers.dev/api/v1/agent-readiness";
          const r=await fetch(u,{signal:AbortSignal.timeout(18000)});
          const j=await r.json();
          console.log("G1 PREPAID READINESS: "+r.status+" free_ci_paid_ai_available="+String(j?.data?.free_ci_paid_ai_available===true));
          if(r.status!==200||j?.data?.free_ci_paid_ai_available!==true)
            throw Error("STAGING_FREE_AI_NOT_READY_NO_MODEL_SPEND");
          JS
      - name: ONE GPT-6.1 source Job max 76c -> saved model journal -> free Docker/Chromium
        run: node deploy/scripts/sp35-g1-paid-real-dice-e2e.mjs

  g1-one-real-postgres-db-app:
    # Human $1 aggregate cap; one new Job max 44c, previous G1 GPT-6
    # model call upper reserve 20c: conservative combined <=64c.
    # This job is opt-in by ONE exact commit marker only; no ordinary push cost.
    if: github.repository == 'NFF98/appf2-build' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026' && contains(github.event.head_commit.message, '[SP35-DB-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: No-fee syntax verification, before AI
        run: node --check deploy/scripts/sp35-g1-one-real-db-app-e2e.mjs
      - name: No-fee Staging readiness, before AI
        run: |
          node --input-type=module <<'JS'
          const url="https://appf2-sp35-417-staging.juiyuang69.workers.dev/api/v1/agent-readiness";
          const response=await fetch(url,{signal:AbortSignal.timeout(20000)});
          const data=await response.json();
          console.log("SP35_DB_PREPAID_READY="+String(response.status===200&&data?.data?.free_ci_paid_ai_available===true));
          if(response.status!==200||data?.data?.free_ci_paid_ai_available!==true)
           throw Error("SP35_DB_PREPAID_READINESS_FAIL_ZERO_MODEL_CALLS");
          JS
      - name: Reuse free included GitHub Actions and pinned Chromium for REAL browser proof
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: ONE GPT-6.1 Postgres-records App max 44c; independent QA and true 2-browser RLS CRUD
        run: node deploy/scripts/sp35-g1-one-real-db-app-e2e.mjs

  five-core-real-owner-chain:
    # One explicit existing-PR human-authorized test; NO periodic paid calls.
    # No direct model key in this runner; Staging Worker journals spend FIRST,
    # then dispatches the already-protected GitHub OIDC model runner.
    if: github.repository == 'NFF98/appf2-build' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026' && contains(github.event.head_commit.message, '[SP35-FIVE-CORE-LIVE-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One owner-signed GPT-6.1 model → genuine QA → up to 3 bounded repairs → saved App re-open
        run: node deploy/scripts/sp35-five-core-gpt6-live-owner-e2e.mjs

# Authorized single-call AI E2E rerun after pre-request syntax repair.

# Bounded one-call recheck using official strict OpenAI Responses JSON schema; no automatic retry.

# C4/C5 real browser acceptance: one 76-cent-maximum-approved test Job, six frozen four-player score checks, up to 3 paid repairs; no recurring trigger.

# 2026-11-01 human authorizes exactly ONE fresh original-owner C4/C5 GPT-6 paid Job, approved cumulative maximum 76 cents, no production. [SP35-FIVE-CORE-LIVE-ONCE]
