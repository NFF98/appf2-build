name: Sprint 3.5 ONE bounded real GPT-6 QA/repair chain (76c maximum reservation)
on:
  push:
    branches:
      - product/sprint-3.5-complex-intent-recovery-20261026
    paths:
      - .github/workflows/sp35-one-paid-ai-real-e2e.yml
permissions:
  contents: read
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[SP35-G5-CANCEL-EMPTY-PREJOB]') && 'sp35-g5-cancel-empty-prejob' || 'sp35-one-explicit-paid-ai-e2e' }}
  cancel-in-progress: false
jobs:
  published-recipient-free-only:
    # Existing ACTIVE share only. Never calls an owner generation endpoint.
    if: contains(github.event.head_commit.message, '[SP35-RECIPIENT-FREE-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPF2_RECIPIENT_FREE_OK: '1'
      APPF2_SP35_SAMPLE: 'g10-books'
      APPF2_EXISTING_SHARE_ID: '4c07f75f-1f4b-43d2-9a66-dab6761b8414'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node deploy/scripts/sp35-published-recipient-proof.mjs --preflight-only
      - run: npx playwright install --with-deps chromium
      - name: Independent real UI, reload, no generation, and PG viewer isolation when required
        run: node deploy/scripts/sp35-published-recipient-proof.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sp35-real-published-recipient
          path: ${{ runner.temp }}/sp35-recipient-*.png
          if-no-files-found: error

  remaining-free-preflight:
    if: contains(github.event.head_commit.message, '[SP35-REMAINING-FREE-PREFLIGHT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All frozen original requirements, syntax and no-budget refusal (zero models)
        run: |
          node --check deploy/scripts/sp35-remaining-native-website-e2e.mjs
          node deploy/scripts/sp35-remaining-native-website-e2e.mjs --preflight-all
          if APPF2_SP35_SAMPLE=g6-length node deploy/scripts/sp35-remaining-native-website-e2e.mjs > refusal.log 2>&1; then exit 1; fi
          node --input-type=module -e 'import fs from "node:fs";if(!fs.readFileSync("refusal.log","utf8").includes("PAUSED_BUDGET"))process.exit(1)'
  one-remaining-native-original-request:
    # One selected unseen request, never a generation loop. Operator verifies
    # original journal and remaining 308c conservative liability per SPEC 0.24 before marker.
    if: github.repository == 'NFF98/appf2-build' && contains(github.event.head_commit.message, '[SP35-REMAINING-PAID-ONE-SHOT]')
