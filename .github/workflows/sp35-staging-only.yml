name: Sprint 3.5 staging only (never production)
on:
  # Explicitly scoped to this staging repair branch; pull requests cannot receive secrets.
  push:
    branches:
      - product/sprint-3.5-real-worker-routing-20261026
      - product/sprint-3.5-complex-intent-recovery-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appf2-sp35-staging-only
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'NFF98/appf2-build' && (github.ref == 'refs/heads/product/sprint-3.5-real-worker-routing-20261026' || github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Provision 3 isolated staging Hyperdrives from one protected GitHub secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APPF2_STAGING_DB_CREDS: ${{ secrets.APPF2_STAGING_DB_CREDS }}
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const token=process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account=process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if(!token || !/^[a-f0-9]{32}$/i.test(account||""))
            throw Error("STAGING DB: missing Cloudflare authorization");
          const headers={Authorization:"Bearer "+token,Accept:"application/json","Content-Type":"application/json"};
          const endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/hyperdrive/configs";
          const existing=await fetch(endpoint,{headers});
          console.log("HYPERDRIVE API: "+(existing.ok?"ACCESS_OK":"DENIED_HTTP_"+existing.status));
          if(!existing.ok)throw Error("STAGING DB: no Hyperdrive API permissions");
          const payload=await existing.json();
          if(payload.success!==true)throw Error("STAGING DB: Hyperdrive list failed");
          // Reuse the 3 previously created staging resources without touching passwords.
          const existingConfigs=Array.isArray(payload.result)?payload.result:[];
          const existingNames=[
            ["fresh","APPF2_HYPERDRIVE_FRESH_ID"],
            ["f02","APPF2_HYPERDRIVE_F02_ADMISSION_ID"],
            ["f07","APPF2_HYPERDRIVE_F07_EVENTS_ID"]
          ];
          const resolved=existingNames.map(([suffix,envName]) => ({
            suffix,envName,config:existingConfigs.find(c=>c.name==="appf2-sp35-417-staging-"+suffix)
          }));
          if(resolved.every(x=>typeof x.config?.id==="string")){
            for(const entry of resolved){
              fs.appendFileSync(process.env.GITHUB_ENV,entry.envName+"="+entry.config.id+"\n");
              console.log("STAGING DB: Hyperdrive "+entry.suffix+" REUSED id="+entry.config.id);
            }
            console.log("STAGING DB: all 3 existing configs reused; no credentials required");
            process.exit(0);
          }
          const raw=process.env.APPF2_STAGING_DB_CREDS?.trim();
          if(!raw){
            console.log("STAGING DB: waiting for one protected APPF2_STAGING_DB_CREDS GitHub secret");
            process.exit(0);
          }
          let credentials;
          try{credentials=JSON.parse(raw)}catch{throw Error("STAGING DB: credential JSON invalid")}
          const expected=[
            ["fresh","appf2_sp35_worker_login","APPF2_HYPERDRIVE_FRESH_ID"],
            ["f02","appf2_sp35_f02_login","APPF2_HYPERDRIVE_F02_ADMISSION_ID"],
            ["f07","appf2_sp35_f07_login","APPF2_HYPERDRIVE_F07_EVENTS_ID"]
          ];
          const list=Array.isArray(payload.result)?payload.result:[];
          for(const [key,user,outKey] of expected){
            const name="appf2-sp35-417-staging-"+key;
            const password=credentials[key];
            if(typeof password!=="string"||password.length<48)
              throw Error("STAGING DB: credential missing or too short ("+key+")");
            const found=list.find(x=>x.name===name);
            let id=found?.id;
            if(!id){
              const create=await fetch(endpoint,{method:"POST",headers,body:JSON.stringify({
                name,origin:{scheme:"postgres",host:"db.xxwnxetwufwyiisgaqhl.supabase.co",
                  port:5432,database:"postgres",user,password},
                caching:{disabled:true},mtls:{sslmode:"require"},origin_connection_limit:5
              })});
              const result=await create.json().catch(()=>({}));
              if(!create.ok || result.success!==true || !result.result?.id)
                throw Error("STAGING DB: Hyperdrive "+key+" create HTTP "+create.status+" (secret hidden)");
              id=result.result.id;
            }
            fs.appendFileSync(process.env.GITHUB_ENV,outKey+"="+id+"\n");
            console.log("STAGING DB: Hyperdrive "+key+" "+(found?"REUSED":"CREATED")+" id="+id);
          }
          console.log("STAGING DB: three isolated Hyperdrive resources prepared; live database connection pending");
          JS
      - name: Verify token, account and complete staging inputs (no secret values printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APPF2_STAGING_WORKER_NAME: ${{ vars.APPF2_STAGING_WORKER_NAME }}
          APPF2_HYPERDRIVE_FRESH_ID: ${{ env.APPF2_HYPERDRIVE_FRESH_ID || secrets.APPF2_HYPERDRIVE_FRESH_ID }}
          APPF2_HYPERDRIVE_F02_ADMISSION_ID: ${{ env.APPF2_HYPERDRIVE_F02_ADMISSION_ID || secrets.APPF2_HYPERDRIVE_F02_ADMISSION_ID }}
          APPF2_HYPERDRIVE_F07_EVENTS_ID: ${{ env.APPF2_HYPERDRIVE_F07_EVENTS_ID || secrets.APPF2_HYPERDRIVE_F07_EVENTS_ID }}
          APPF2_MODEL_BASE_URL: ${{ vars.APPF2_MODEL_BASE_URL }}
          APPF2_MODEL_NAME: ${{ vars.APPF2_MODEL_NAME }}
          APPF2_MODEL_API_KEY: ${{ secrets.APPF2_MODEL_API_KEY }}
          APPF2_IDENTITY_COOKIE_SECRET: ${{ secrets.APPF2_IDENTITY_COOKIE_SECRET }}
          APPF2_STAGING_URL: ${{ vars.APPF2_STAGING_URL }}
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const check = (condition, reason) => {
            if (!condition) throw new Error("STAGING PREFLIGHT: " + reason);
          };
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          check(Boolean(token), "MISSING CLOUDFLARE_API_TOKEN (Repository Secret)");
          check(/^[a-f0-9]{32}$/i.test(account || ""), "MISSING_OR_INVALID CLOUDFLARE_ACCOUNT_ID (Repository Variable)");
          const headers = {Authorization: "Bearer " + token, Accept: "application/json"};
          const verify = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {headers});
          const v = await verify.json().catch(() => ({}));
          check(verify.ok && v.success === true && v.result?.status === "active",
            "TOKEN_VERIFICATION_FAILED_HTTP_" + verify.status);
          console.log("CLOUDFLARE AUTH: ACTIVE TOKEN VERIFIED (token not printed)");
          const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account, {headers});
          const a = await response.json().catch(() => ({}));
          check(response.ok && a.success === true && a.result?.id === account,
            "ACCOUNT_ACCESS_DENIED_OR_MISMATCH_HTTP_" + response.status);
          console.log("CLOUDFLARE ACCOUNT: VERIFIED (ID omitted from log)");
          import {createHmac} from "node:crypto";
          const defaults={
            APPF2_STAGING_WORKER_NAME: "appf2-sp35-417-staging",
            APPF2_MODEL_BASE_URL: "https://api.openai.com/v1",
            APPF2_MODEL_NAME: "gpt-4.1",
            APPF2_IDENTITY_COOKIE_SECRET: createHmac("sha256",token)
              .update("appf2-sp35-staging-identity-secret-v1").digest("hex")
          };
          // GitHub runner env is set without printing any default secret.
          for(const [name,value] of Object.entries(defaults)){
            if(!process.env[name]?.trim()){
              if(name==="APPF2_IDENTITY_COOKIE_SECRET") console.log("::add-mask::"+value);
              fs.appendFileSync(process.env.GITHUB_ENV,name+"="+value+"\n");
              process.env[name]=value;
            }
          }
          // Subsequent deploy step inherits these values without re-reading secrets.
          for(const name of ["APPF2_HYPERDRIVE_FRESH_ID",
            "APPF2_HYPERDRIVE_F02_ADMISSION_ID","APPF2_HYPERDRIVE_F07_EVENTS_ID"]){
            if(process.env[name]?.trim())
              fs.appendFileSync(process.env.GITHUB_ENV,name+"="+process.env[name].trim()+"\n");
          }
          if(process.env.APPF2_IDENTITY_COOKIE_SECRET?.trim()){
            console.log("::add-mask::"+process.env.APPF2_IDENTITY_COOKIE_SECRET.trim());
            fs.appendFileSync(process.env.GITHUB_ENV,
              "APPF2_IDENTITY_COOKIE_SECRET="+process.env.APPF2_IDENTITY_COOKIE_SECRET.trim()+"\n");
          }
          const names = [
            "APPF2_HYPERDRIVE_FRESH_ID", "APPF2_HYPERDRIVE_F02_ADMISSION_ID",
            "APPF2_HYPERDRIVE_F07_EVENTS_ID", "APPF2_MODEL_API_KEY"
          ];
          const missing = names.filter(name => !process.env[name]?.trim());
          if (missing.length) {
            const summary = "### Bootstrap-only: AI/PostgreSQL/Creation NOT CONFIGURED\n" +
              missing.map(name => "- `" + name + "`").join("\n") +
              "\nCloudflare token and account verified. Running real Worker + SPA first-hop smoke only.\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            fs.appendFileSync(process.env.GITHUB_ENV, "APPF2_STAGING_BOOTSTRAP_ONLY=1\n");
            console.log("STAGING BOOTSTRAP ONLY: missing " + missing.join(", "));
          } else {
            console.log("STAGING FULL MODE: all AI/PG bindings present");
          }
          JS
      - name: Confirm OpenAI credential works (no key or response exposed)
        env:
          APPF2_MODEL_API_KEY: ${{ secrets.APPF2_MODEL_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.APPF2_MODEL_API_KEY?.trim()) {
            console.log("OPENAI CREDENTIAL: NOT CONFIGURED");
            process.exit(0);
          }
          // This is a read-only credential preflight. OpenAI 5xx means upstream
          // outage, not a revoked key. Retry only transient 5xx / transport
          // failures, bounded to three checks; never retry 401/403/400.
          let status = 0, accepted = false;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            try {
              const response = await fetch("https://api.openai.com/v1/models", {
                headers: { Authorization: "Bearer " + process.env.APPF2_MODEL_API_KEY },
                signal: AbortSignal.timeout(15000)
              });
              status = response.status;
              if (response.ok) { accepted = true; break; }
              if (status < 500 || status > 599) break;
            } catch {
              status = 0; // network failure, not proof of an invalid credential
            }
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 700));
          }
          console.log("OPENAI PREFLIGHT: " + (accepted ? "ACCEPTED" :
            status >= 500 || status === 0 ? "UPSTREAM_UNAVAILABLE_HTTP_" + status :
            status === 429 ? "RATE_LIMITED_HTTP_429" : "CREDENTIAL_REJECTED_HTTP_" + status));
          // A GET /models outage is not a credential rejection and must not
          // block the real signed Create E2E. Only a definitive 4xx denial
          // (except 429) fails early. Actual POST/AI/DB/F02/F03 remain
          // mandatory and fail closed if upstream is still unavailable.
          if (!accepted && status >= 400 && status < 500 && status !== 429)
            process.exitCode = 1;
          JS
      # Do not burn an extra model completion before the actual signed CREATE.
      # The real request, database receipt and Chromium render verify generation.
      - name: Use only real signed CREATE as live model generation proof
        if: env.APPF2_STAGING_BOOTSTRAP_ONLY != '1'
        run: echo "APPF2_MODEL_CHAT_READY=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Product build (no fixture counted as LIVE PASS)
        run: |
          npm run check:types
          npm run check:lint
          npm run test:api
          npm run test:runtime
          npm run web:build
      - name: Deploy ONLY isolated staging Worker with bundled SPA
        env:
          APPF2_STAGING_BOOTSTRAP_ONLY: ${{ env.APPF2_STAGING_BOOTSTRAP_ONLY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APPF2_STAGING_WORKER_NAME: ${{ vars.APPF2_STAGING_WORKER_NAME }}
          APPF2_HYPERDRIVE_FRESH_ID: ${{ env.APPF2_HYPERDRIVE_FRESH_ID || secrets.APPF2_HYPERDRIVE_FRESH_ID }}
          APPF2_HYPERDRIVE_F02_ADMISSION_ID: ${{ env.APPF2_HYPERDRIVE_F02_ADMISSION_ID || secrets.APPF2_HYPERDRIVE_F02_ADMISSION_ID }}
          APPF2_HYPERDRIVE_F07_EVENTS_ID: ${{ env.APPF2_HYPERDRIVE_F07_EVENTS_ID || secrets.APPF2_HYPERDRIVE_F07_EVENTS_ID }}
          APPF2_MODEL_BASE_URL: ${{ vars.APPF2_MODEL_BASE_URL || 'https://api.openai.com/v1' }}
          APPF2_MODEL_NAME: ${{ vars.APPF2_MODEL_NAME || 'gpt-4.1' }}
          APPF2_MODEL_API_KEY: ${{ secrets.APPF2_MODEL_API_KEY }}
          APPF2_MODEL_PROVIDER: ${{ vars.APPF2_MODEL_PROVIDER }}
          # Isolated staging only: the owner explicitly requested Grok alongside OpenAI.
          # Use it on OpenAI 429 only if BOTH server-side key and model are configured.
          # Production remains controlled by its separate deployment configuration.
          APPF2_MODEL_FALLBACK_PROVIDER: ${{ vars.APPF2_MODEL_FALLBACK_PROVIDER }}
          # Source-controlled, staging-only opt-in authorized for xAI on OpenAI 429.
          # Deploy script refuses to activate without BOTH key and model; production unaffected.
          APPF2_STAGING_XAI_ON_429: '1'
          APPF2_XAI_MODEL_NAME: ${{ vars.APPF2_XAI_MODEL_NAME }}
          APPF2_XAI_API_KEY: ${{ secrets.APPF2_XAI_API_KEY }}
          APPF2_DEEPSEEK_MODEL_NAME: ${{ vars.APPF2_DEEPSEEK_MODEL_NAME }}
          APPF2_DEEPSEEK_API_KEY: ${{ secrets.APPF2_DEEPSEEK_API_KEY }}
        run: node deploy/scripts/sp35-staging-only.mjs
      - name: Real Worker first-hop smoke (not full Creation)
        run: node deploy/scripts/sp35-staging-smoke.mjs
      - name: Free saved-App card browser smoke (NO AI / no F01 CREATE)
        run: |
          npx playwright install chromium
          node deploy/scripts/sp35-saved-app-no-model-smoke.mjs
      - name: Real browser F05 publish -> stranger -> F03 actions (free scripted model / fixture DB)
        run: node deploy/scripts/sp35-public-card-browser-no-model.mjs
      - name: Allow one paid E2E only on manual dispatch or configured fallback
        if: env.APPF2_STAGING_BOOTSTRAP_ONLY != '1'
        env:
          HAS_XAI_KEY: ${{ secrets.APPF2_XAI_API_KEY != '' }}
          HAS_XAI_MODEL: ${{ vars.APPF2_XAI_MODEL_NAME != '' }}
          HAS_DEEPSEEK_KEY: ${{ secrets.APPF2_DEEPSEEK_API_KEY != '' }}
          HAS_DEEPSEEK_MODEL: ${{ vars.APPF2_DEEPSEEK_MODEL_NAME != '' }}
          CONFIGURED_FALLBACK: ${{ vars.APPF2_MODEL_FALLBACK_PROVIDER }}
          PRIMARY_PROVIDER: ${{ vars.APPF2_MODEL_PROVIDER || 'openai' }}
          TRIGGER: ${{ github.event_name }}
          ONE_SHOT: ${{ contains(github.event.head_commit.message, '[SP35-LIVE-CREATE-ONCE]') }}
          BROWSER_SHOT: ${{ contains(github.event.head_commit.message, '[SP35-BROWSER-ONCE]') }}
          COMPLEX_SHOT: ${{ contains(github.event.head_commit.message, '[SP35-COMPLEX-ONCE]') }}
          TASK_SHOT: ${{ contains(github.event.head_commit.message, '[SP35-TASKS-ONCE]') }}
          MOVING_SHOT: ${{ contains(github.event.head_commit.message, '[SP35-MOVING-ONCE]') }}
        run: |
          # Each paid test is an independently authorized, bounded, one-shot choice.
          # Ordinary pushes and configured backups do not trigger paid requests.
          if [[ "$ONE_SHOT" == 'true' || "$TRIGGER" == 'workflow_dispatch' ]]; then
            echo "APPF2_SP35_LIVE_CREATE_ALLOWED=1" >> "$GITHUB_ENV"
            echo "STAGING LIVE E2E: signed API CREATE/COMPILE authorized exactly once"
          fi
          if [[ "$BROWSER_SHOT" == 'true' || "$COMPLEX_SHOT" == 'true' || "$TASK_SHOT" == 'true' || "$MOVING_SHOT" == 'true' ]]; then
            echo "APPF2_SP35_LIVE_BROWSER_ALLOWED=1" >> "$GITHUB_ENV"
            echo "STAGING LIVE BROWSER: browser Create App authorized separately"
          fi
          if [[ "$MOVING_SHOT" == 'true' ]]; then
            echo "APPF2_SP35_BROWSER_MOVING_ALLOWED=1" >> "$GITHUB_ENV"
          fi
          if [[ "$TASK_SHOT" == 'true' ]]; then
            echo "APPF2_SP35_BROWSER_TASKS_ALLOWED=1" >> "$GITHUB_ENV"
            echo "STAGING LIVE BROWSER: one natural-language task-list create authorized"
          fi
          if [[ "$COMPLEX_SHOT" == 'true' ]]; then
            echo "APPF2_SP35_BROWSER_COMPLEX_ALLOWED=1" >> "$GITHUB_ENV"
            echo "STAGING LIVE BROWSER: full five-function LifePilot F01-F02-F03 browser E2E explicitly requested"
          fi
      - name: Live signed CREATE with sanitized Cloudflare upstream diagnostics
        if: env.APPF2_STAGING_BOOTSTRAP_ONLY != '1' && env.APPF2_MODEL_CHAT_READY == '1' && env.APPF2_SP35_LIVE_CREATE_ALLOWED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@4.135.0 tail appf2-sp35-417-staging --format json > "$RUNNER_TEMP/sp35-worker-tail.log" 2>&1 &
          TAIL_PID=$!
          sleep 9
          node deploy/scripts/sp35-staging-live-create.mjs
          CREATE_RC=$?
          sleep 4
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const p=process.env.RUNNER_TEMP+"/sp35-worker-tail.log";
          const raw=fs.existsSync(p)?fs.readFileSync(p,"utf8"):"";
          const statuses=[...new Set(raw.match(/APPF2_MODEL_UPSTREAM_STATUS=[0-9]{3}/g)||[])];
          const codes=[...new Set(raw.match(/APPF2_MODEL_UPSTREAM_429_CODE=(rate_limit_exceeded|insufficient_quota|credit_balance_exhausted|organization_usage_limit_exceeded|organization_spend_limit_exceeded|project_spend_limit_exceeded|unknown)/g)||[])];
          const failures=[...new Set(raw.match(/APPF2_MODEL_UPSTREAM_TRANSPORT=[A-Za-z]{1,32} ABORTED=(true|false)/g)||[])];
          const validations=[...new Set(raw.match(/APPF2_MODEL_ANALYSIS_INVALID=[^"\r\n]{1,700}/g)||[])];
          const coverage=[...new Set(raw.match(/APPF2_F02_COVERAGE_SELECTED_COUNT=[0-9]+ STATUS=(FULLY_SUPPORTED|PARTIALLY_SUPPORTED|UNSUPPORTED)/g)||[])];
          console.log("STAGING MODEL DIAGNOSTICS: "+(statuses.length||codes.length||failures.length||validations.length||coverage.length
            ? [...statuses,...codes,...failures,...validations,...coverage].join("; ")
            : "NO_MODEL_MARKERS_OBSERVED (tail permission/connection may be unavailable)"));
          JS
          exit "$CREATE_RC"
      - name: Live Chromium real Create App + render + Home navigation
        if: env.APPF2_STAGING_BOOTSTRAP_ONLY != '1' && env.APPF2_MODEL_CHAT_READY == '1' && env.APPF2_SP35_LIVE_BROWSER_ALLOWED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APPF2_SP35_BROWSER_TASKS_ALLOWED: ${{ env.APPF2_SP35_BROWSER_TASKS_ALLOWED }}
        run: |
          npx playwright install chromium
          npx --yes wrangler@4.135.0 tail appf2-sp35-417-staging --format json > "$RUNNER_TEMP/sp35-complex-tail.log" 2>&1 &
          TAIL_PID=$!
          sleep 8
          set +e
          # Five-function proof takes priority if both one-shot flags are present.
          # Moving verifies only three functions and MUST NOT silently replace LifePilot.
          if [[ "${APPF2_SP35_BROWSER_COMPLEX_ALLOWED:-0}" == "1" ]]; then
            node deploy/scripts/sp35-lifepilot-browser-e2e.mjs
          elif [[ "${APPF2_SP35_BROWSER_MOVING_ALLOWED:-0}" == "1" ]]; then
            node deploy/scripts/sp35-moving-analysis-e2e.mjs
          else
            node deploy/scripts/sp35-staging-browser-e2e.mjs
          fi
          BROWSER_RC=$?
          sleep 4
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const p=process.env.RUNNER_TEMP+"/sp35-complex-tail.log";
          const raw=fs.existsSync(p)?fs.readFileSync(p,"utf8"):"";
          const reasons=[...new Set(raw.match(/APPF2_MODEL_ANALYSIS_INVALID=[^"\r\n]{1,700}/g)||[])];
          const shape=[...new Set(raw.match(/APPF2_MODEL_ANALYSIS_SHAPE=[A-Za-z0-9._:|=/-]{1,650}/g)||[])];
          console.log("STAGING COMPLEX VALIDATION PATHS: "+
            (reasons.length||shape.length?[...reasons,...shape].slice(-8).join("; "):"NOT_OBSERVED"));
          // Fixed labels/codes only: no AI response body, prompts, DB rows or API keys.
          const coverage=[...new Set(raw.match(/APPF2_F02_COVERAGE_SELECTED_COUNT=[0-9]+ STATUS=(FULLY_SUPPORTED|PARTIALLY_SUPPORTED|UNSUPPORTED) PROFILE=[A-Z_]+/g)||[])];
          const modes=[...new Set(raw.match(/APPF2_F02_PLAN_MODE=(TYPED|RAW) REQUIREMENT_COUNT=[0-9]+/g)||[])];
          const roles=[...new Set(raw.match(/APPF2_F02_SELECTED_ROLES=[a-z.,]{1,250}/g)||[])];
          const typedReasons=[...new Set(raw.match(/APPF2_F02_(?:TYPED_FAILURE|PLAN_REJECT)=(PLAN_SCHEMA_INVALID|PLAN_UNTRUSTED_REFERENCE|COMPOSITION_UNSUPPORTED|LOWERING_GRAPH_INVALID) PATH=\$?[a-z.\[\]0-9_]{1,110}/g)||[])];
          const rejectedRoles=[...new Set(raw.match(/APPF2_F02_TYPED_ROLE_REJECT=(?:[a-z]+\.[a-z]+|UNKNOWN)/g)||[])];
          const f04=[...new Set(raw.match(/APPF2_F04_UNSUPPORTED_SIGNATURES=[A-Za-z0-9._+|]{1,450}/g)||[])];
          const upstream=[...new Set(raw.match(/APPF2_MODEL_UPSTREAM_STATUS=[0-9]{3}/g)||[])];
          const transport=[...new Set(raw.match(/APPF2_MODEL_UPSTREAM_TRANSPORT=[A-Za-z]{1,32} ABORTED=(true|false)/g)||[])];
          console.log("STAGING COMPLEX COMPOSE DIAGNOSTICS: "+
            ([...coverage,...modes,...roles,...typedReasons,...rejectedRoles,...f04,...upstream,...transport].slice(-12).join("; ")||"NOT_OBSERVED"));
          JS
          exit "$BROWSER_RC"
      - name: Upload real browser screenshot (staging five-feature LifePilot)
        if: always() && env.APPF2_SP35_LIVE_BROWSER_ALLOWED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sp35-staging-browser
          path: ${{ runner.temp }}/appf2-sp35-browser.png
          retention-days: 3
          if-no-files-found: error
