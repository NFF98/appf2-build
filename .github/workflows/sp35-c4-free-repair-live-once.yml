name: Sprint 3.5 C4 real signed FAIL→manual repair→Chromium PASS (zero AI)
on:
  push:
    branches:
      - product/sprint-3.5-complex-intent-recovery-20261026
    paths:
      - .github/workflows/sp35-c4-free-repair-live-once.yml
permissions:
  contents: read
concurrency:
  group: appf2-c4-free-repair-real-once
  cancel-in-progress: false
jobs:
  original-job-repair-e2e:
    if: github.repository == 'NFF98/appf2-build' && contains(github.event.head_commit.message, '[SP35-C4-FREE-LIVE-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One actual P256 signed Job → real QA FAIL → manual source revision → new real QA PASS and reopen
        run: node deploy/scripts/sp35-c4-signed-fail-repair-pass-live.mjs

# This proves persistence/Chromium plumbing only. Never claim AI autonomous repair.
# Absolutely NO provider API key, paid model call, private container or production deploy.
