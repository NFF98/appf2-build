name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, fix/gate-first-generic-evidence-20261015]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Required security and functional gates run before Human Final Ready.
  # Final Ready/BCE still govern merge; they must not suppress genuine test results.
  ci:
    env:
      APPF2_GOV392_TEST_PHASE: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main-only merge provenance guard (PR tests never pre-blocked)
        if: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/fix/gate-first-generic-evidence-20261015' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Repository lint
        run: npm run check:lint
      - name: Install Playwright browsers
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --no -- playwright install --with-deps chromium firefox webkit
      - name: Product CI (one-time founding governance-only N/A when exact scope)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/fix/gate-first-generic-evidence-20261015' && '8a471763ab762cf486e42dd9efd52d9195113a97') || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            import { isOneTimeConstitutionFounding } from "./harness/scripts/validate-constitutional-change.mjs";
            const base=process.env.BASE_SHA,head=process.env.HEAD_SHA;
            const changed=execFileSync("git",["diff","--name-only",base,head],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
            const cs=JSON.parse(fs.readFileSync("delivery/CURRENT-SPRINT.json","utf8"));
            const build=JSON.parse(fs.readFileSync("build-spec/CURRENT.json","utf8"));
            if(!isOneTimeConstitutionFounding({changed,base,cs,build})) process.exit(1);
          '; then
            echo "::notice::GOV-CONST-001 exact-SHA exact-seven-path founding only: Product CI=N/A (NOT PASS); T006 missing product tests remain BLOCKED"
          else
            npm run product:ci
          fi

      - name: Governance / traceability gates
        env:
          APPF2_CONSTITUTION_PUBKEY_B64: ${{ vars.APPF2_CONSTITUTION_PUBKEY_B64 }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/fix/gate-first-generic-evidence-20261015' && '8a471763ab762cf486e42dd9efd52d9195113a97') || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run gate

  # Non-required Final Ready audit. The four mandated status checks must be able
  # to PASS before GPT BCE and Human Final Ready; never bind post-test approvals
  # into their success condition. Main provenance remains protected independently.
  final-ready-audit:
    name: Final Ready evidence (not one of four required checks)
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ordered Local tests, independent BCE, Human Final Ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh

  # Non-required Draft fast loop: impacted tests only. Its PASS is never a full-gate PASS.
  fast-loop:
    # Keep the exact-head Draft PASS named fast-loop. A later Ready event skips
    # this job under a DIFFERENT check name, so it cannot shadow PASS as SKIPPED.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'fast-loop' || 'fast-loop-ready-skipped' }}
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Final Ready exact-HEAD synthetic attack and positive tests (not Human approval)
        run: node harness/scripts/final-ready-selftest.mjs
      - name: Attack fixture environment isolation (synthetic, NOT Attack PASS)
        run: node harness/scripts/w1-01-evidence-mirror.mjs env-selftest
      - name: Exact candidate digest preview (informational, NOT approval)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import {execFileSync} from "node:child_process";
            import {candidateDigestOf} from "./harness/scripts/final-ready-preflight.mjs";
            const files=execFileSync("git",["diff","--name-only",process.env.BASE_SHA,"HEAD"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
            const digest=candidateDigestOf(files.map(filename=>({filename})),rel=>fs.readFileSync(rel));
            if(!digest) process.exit(1);
            console.log("EXACT_CANDIDATE_BASE="+process.env.BASE_SHA);
            console.log("EXACT_CANDIDATE_DIGEST_SHA256="+digest);
            console.log("EXACT_CANDIDATE_PATHS="+JSON.stringify(files));
          '
      - name: Plan impacted tests
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node harness/scripts/select-impacted-tests.mjs
      - name: Install Playwright browsers (browser-impacted diffs only)
        if: ${{ steps.plan.outputs.needs_browsers == 'true' }}
        run: npx --no -- playwright install --with-deps chromium firefox webkit
      - name: Impacted tests (fast loop, NOT a full-gate PASS)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node harness/scripts/select-impacted-tests.mjs --run
