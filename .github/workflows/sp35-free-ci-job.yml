name: Sprint 3.5 free private Agent CI build (OIDC, no paid cloud)
on:
  push:
    branches:
      - product/sprint-3.5-complex-intent-recovery-20261026
    paths:
      - .github/workflows/sp35-free-ci-job.yml
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: sp35-free-ci-${{ github.event.inputs.ticket || github.sha }}
  cancel-in-progress: false
jobs:
  private-source-docker:
    if: github.repository == 'NFF98/appf2-build' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: OIDC-authorized PRIVATE source → free Docker → browser smoke, no paid AI
        env:
          APPF2_FREE_CI_TICKET: ${{ inputs.ticket }}
        run: node deploy/scripts/sp35-free-ci-dispatched-build.mjs
