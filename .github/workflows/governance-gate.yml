name: Governance Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  deployments: read

jobs:
  # Required security and functional gates run before Human Final Ready.
  # Final Ready/BCE still govern merge; they must not suppress genuine test results.
  governance:
    env:
      APPF2_GOV16_TEST_PHASE: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 真實 Human Task 授權預檢（未核准不跑完整 Gate）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-task-human-grant-preflight.sh
      - name: Main-only merge provenance guard (PR tests never pre-blocked)
        if: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/governance/task-one-approval-20261016' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 16P live GitHub unauthorized negative integration (real API, read-only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/governance/task-one-approval-20261016' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPF2_NEGATIVE_PR_NUMBER: "401"
        run: node harness/scripts/trusted-human-task-grant-selftest.mjs --live-negative
      - name: Run repository gates
        env:
          APPF2_CONSTITUTION_PUBKEY_B64: ${{ vars.APPF2_CONSTITUTION_PUBKEY_B64 }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/governance/task-one-approval-20261016' && '8a471763ab762cf486e42dd9efd52d9195113a97') || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run gate
      - name: Verify all original 16 reform entrypoints in the real checkout
        run: |
          node --input-type=module -e '
            import {auditReformWiring} from "./harness/scripts/reform-wiring-audit.mjs";
            const report=auditReformWiring();
            console.log("原始改革："+report.checks.length+" 個靜態入口存在；真實 E2E 未完成，不得宣稱已實施。");
            console.log("驗收結果："+report.acceptance.decision+"／已確認真實 E2E "+report.acceptance.verified_end_to_end+" 項；詳細缺口見 reform-wiring-audit.mjs");
          '
      - name: 一般 Task 真實 GitHub Human 一次授權驗證（無核准即 FAIL）
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node -e '
            const e=JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH));
            process.exit(/^Task:\\s*T\\d{3}\\b/m.test(e.pull_request?.body||"")?0:1);
          '; then
            node harness/scripts/trusted-human-task-grant.mjs
          else
            echo "非一般 Task PR：沿用既有 L2/L3 Human 精確核准規則"
          fi
      # GOV-REFORM-20261013: one Task -> one open PR unless a recorded PR-Justification exists.
      - name: PR proliferation guard (fail closed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "${{ github.repository }}" --state open --limit 200 --json number,title,body,isDraft > "$RUNNER_TEMP/open-prs.json"
          node harness/scripts/gpt-preflight.mjs pr-guard --event "$GITHUB_EVENT_PATH" --open-prs "$RUNNER_TEMP/open-prs.json" --inventory-limit 200
      - name: Change routing (informational; gates above decide legality)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node harness/scripts/task-pr-lifecycle.mjs classify

  evidence-ledger-report:
    name: Task Evidence automatic ledger (report only; NOT Product PASS)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aggregate live Task evidence without modifying canonical records
        run: |
          node harness/scripts/evidence-ledger-report.mjs \
            --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/task-evidence-report.json"
      - name: Upload canonical-reference ledger (NOT automatic Task Closure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-evidence-ledger
          path: ${{ runner.temp }}/task-evidence-report.json
          if-no-files-found: warn

  real-e2e-16p:
    name: 16P actual operational E2E (not audit-only)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for real tests
        run: npm ci
      - name: Run all 16 real operational checks and actual Vitest
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'OPERATIONAL'
          import fs from "node:fs";
          import path from "node:path";
          import {spawnSync} from "node:child_process";
          import {resolveRunnablePlan} from "./harness/scripts/select-impacted-tests.mjs";
          const r=process.env.GITHUB_REPOSITORY,pr=Number(process.env.PR_NUMBER),head=process.env.PR_HEAD;
          const tmp=process.env.RUNNER_TEMP,results=[];
          const ids=["1","2","3","4","5","6","7","8","9","A","B","C","D","E","F","16"];
          function exec(cmd,args=[],timeout=90000){
           const a=spawnSync(cmd,args,{encoding:"utf8",timeout,maxBuffer:4e6});
           return {cmd:[cmd,...args].join(" "),exit:a.status,error:a.error?.message||null,
            raw_stdout:(a.stdout||""),output:(a.stdout||"").slice(-1400)+"\n"+(a.stderr||"").slice(-700)};
          }
          function row(id,status,steps,note){
           results.push({id,status,steps,note});
           console.log("16P /"+id+"/ "+status+" — "+note);
          }
          const gh=(...args)=>exec("gh",["api",...args]);
          const js=(...args)=>exec("node",args);
          const evidence=(name)=>"https://github.com/"+r+"/"+name;
          const live=gh("repos/"+r+"/pulls/"+pr);
          let liveJson=null;try{liveJson=JSON.parse(live.raw_stdout)}catch{}
          if(live.exit!==0||liveJson?.head?.sha!==head||liveJson?.state!=="open")
           throw Error("HARD_STOP: real GitHub PR exact HEAD verification failed");
          const active=JSON.parse(fs.readFileSync("delivery/CURRENT-SPRINT.json","utf8"));
          const task=active.active_task||"T008";
          const open=exec("gh",["pr","list","--repo",r,"--state","open","--limit","200","--json","number,title,body,isDraft"]);
          let prs=[];try{prs=JSON.parse(open.raw_stdout)}catch{}
          const inv=path.join(tmp,"16p-open-prs.json");fs.writeFileSync(inv,JSON.stringify(prs));
          const grant=js("harness/scripts/gpt-preflight.mjs","state","--task",task,"--intent","REQUEST_APPROVAL","--open-prs",inv);
          const baseline=js("harness/scripts/validate-baseline.mjs");
          const activation=js("harness/scripts/validate-activation.mjs");
          const changed=js("harness/scripts/validate-change-scope.mjs");
          const prGuard=js("harness/scripts/gpt-preflight.mjs","pr-guard","--event",process.env.GITHUB_EVENT_PATH,"--open-prs",inv);
          const evidenceFile=path.join(tmp,"16p-evidence-report.json");
          const ledger=js("harness/scripts/evidence-ledger-report.mjs","--event",process.env.GITHUB_EVENT_PATH,"--out",evidenceFile);
          const preflight=js("harness/scripts/gpt-preflight.mjs","state","--task",task,"--intent","CONTINUE_TASK_WORK","--open-prs",inv);
          const metrics=js("harness/scripts/governance-metrics.mjs","--ref","origin/main","--since","2026-10-10");
          const integrity=js("harness/scripts/validate-test-integrity.mjs");
          const realChecks=gh("repos/"+r+"/commits/"+head+"/check-runs");
          const featureCi=gh("repos/"+r+"/actions/workflows/ci.yml/runs?per_page=40&branch="+encodeURIComponent(liveJson.head.ref));
          let featureRuns=null;
          try{featureRuns=featureCi.exit===0?JSON.parse(featureCi.raw_stdout).workflow_runs:null}catch{}
          const featurePushes=Array.isArray(featureRuns)?featureRuns.filter(x=>x.event==="push"):null;
          const sampledPolicy=js("--input-type=module","-e",
            'import{fullCiRuns}from"./harness/scripts/governance-metrics.mjs";const job={id:115,name:"ci",status:"completed",conclusion:"success",attempt:1};const row={id:101,name:"CI Gate",event:"pull_request",headSha:"a".repeat(40),headBranch:"branch",runAttempt:1,jobs:[job]};const s=fullCiRuns({complete:true,window_start:"2026-10-10",sample:{strategy:"newest",listed:1156,enriched:1,truncated:true},runs:[row]});if(s.status!=="INCOMPLETE_SAMPLED"||s.full_ci_runs!==null||s.sample_counts.ready_ci_executed!==1)process.exit(8);console.log("LIVE RUNNER #9 sample safety: PASS, even when exporter lies complete:true");');
          const design=gh("repos/NFF98/appf2-design/branches/main");
          const taskCli=js("harness/scripts/task-pr-lifecycle.mjs","classify");
          row("1",taskCli.exit===0?"PARTIAL":"FAIL",[live,taskCli],"真 PR/Task CLI 已執行；未真 Merge/Closure");
          row("2","AUTHORITY_REQUIRED",[grant],"Task Human grant 預檢已實際執行，缺真人授權的完整正向流程");
          row("3",realChecks.exit===0&&featureCi.exit===0&&featurePushes?.length===0?"PARTIAL":"FAIL",
            [realChecks,featureCi,{cmd:"feature branch push CI event audit",exit:featurePushes?.length===0?0:1,
            push_count:featurePushes?.length??null,pr_runs:featureRuns?.filter(x=>x.event==="pull_request").length??null}],
            "真 GitHub CI API 驗證本分支只有 PR-trigger（無 Push 重跑）；仍須 Merge 後觀察節流。");
          row("4","AUTHORITY_REQUIRED",[activation],"Activation Validator 已真跑；不可自行批准 Task Activation");
          row("5","AUTHORITY_REQUIRED",[baseline],"Baseline Validator 真跑；不可擅自 Rebind");
          row("6",ledger.exit===0?"PARTIAL":"FAIL",[ledger],"真 Evidence 自動彙整已跑；不是 Canonical Registry 寫入");
          row("7","AUTHORITY_REQUIRED",[changed],"真例外 Gate 已跑；修改 #404 導致精確核准過期");
          row("8","PARTIAL",[preflight],"真 preflight CLI 已操作；GPT 外部工具硬攔尚未接線");
          row("9",metrics.exit===0&&sampledPolicy.exit===0?"PARTIAL":"FAIL",[metrics,sampledPolicy],
            "真 Git Runner 執行 #9 舊 complete:true 欺騙回歸並成功阻止全數誤報；尚無前後節流效益基線。");
          row("A",open.exit===0?"PARTIAL":"FAIL",[open,prGuard],"真 GitHub open PR inventory + Guard 執行；未證明建立 PR 前 API 硬拒絕");
          row("B","AUTHORITY_REQUIRED",[grant],"真的執行重複核准檢查；不可偽造真人 Task grant");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const plan=resolveRunnablePlan({mode:"E2E",scripts:["test:state-machine","test:contract"],not_run:[],reasons:[]},pkg,process.cwd());
          const absent=plan.absent_suites.some(x=>x.script==="test:state-machine"&&x.files===0&&x.status==="NOT_RUN_NO_TEST_FILES");
          const present=plan.scripts.includes("test:contract")&&!plan.scripts.includes("test:state-machine");
          const contract=present?exec("npm",["run","test:contract"],180000):{cmd:"test:contract not selected",exit:null};
          row("C",absent&&present&&contract.exit===0?"PASS":"FAIL",[{cmd:"Actual Repo test file selector",exit:absent&&present?0:1,
            output:JSON.stringify({absent_suites:plan.absent_suites,runnable:plan.scripts})},contract],
           "真 Repo 缺檔 NOT_RUN；有檔由 GitHub Runner 真的執行 Vitest："+String(contract.exit));
          row("D","AUTHORITY_REQUIRED",[integrity],"真 Test Integrity Validator 已跑；PostgreSQL/Browser proof policy 不能偽造");
          row("E",ledger.exit===0?"PARTIAL":"FAIL",[ledger],"真 ledger 已執行，合法 Evidence Registry 寫入與結案尚缺");
          row("F","PARTIAL",[preflight,prGuard],"真 preflight CLI 已執行；不代表 ChatGPT tool API 被硬攔");
          row("16","AUTHORITY_REQUIRED",[design],"真 GitHub Design Main API 已讀；跨 Repo protected 寫入尚缺真人核准");
          if(results.length!==16||ids.some((x,i)=>results[i].id!==x))throw Error("16P missing cases");
          const statuses=["PASS","FAIL","PARTIAL","NOT_RUN","AUTHORITY_REQUIRED"];
          const counts=Object.fromEntries(statuses.map(s=>[s,results.filter(v=>v.status===s).length]));
          const out={schema:"APPF2-16P-OPERATIONAL-V2",pr,head,run_id:process.env.GITHUB_RUN_ID,
            prior_report:"VOID_INVALID_METHOD:39003122776",counts,complete_e2e_verified:counts.PASS,
            real_operations_executed:true,cases:results};
          fs.writeFileSync(path.join(tmp,"16p-operational-results.json"),JSON.stringify(out,null,2)+"\n");
          const msg=["# 16P Operational E2E v2 — real GitHub Actions",
           "PASS "+counts.PASS+"; FAIL "+counts.FAIL+"; PARTIAL "+counts.PARTIAL+
           "; NOT_RUN "+counts.NOT_RUN+"; AUTHORITY_REQUIRED "+counts.AUTHORITY_REQUIRED,
           "Real GitHub API, real repo CLI, actual test-file inventory, real Vitest. No fake approval.",
           ...results.map(x=>"- "+x.id+" **"+x.status+"** "+x.note)].join("\n")+"\n";
          console.log(msg);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,msg);
          if(counts.FAIL)process.exitCode=1;
          OPERATIONAL
      - name: Upload only v2 operation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 16p-actual-operational-results
          path: ${{ runner.temp }}/16p-operational-results.json
          if-no-files-found: warn

  six-gap-prewrite-live:
    name: 16P #1/#6/#8/#A/#E/#F guarded GitHub write denials (real API)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real GitHub negative-operation enforcement before unauthorized write
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/16p-write"
          set +e
          node harness/scripts/guarded-github-write.mjs --operation PR_CREATE --task T099 --out "$RUNNER_TEMP/16p-write/pr-create.json"
          a=$?
          node harness/scripts/guarded-github-write.mjs --operation EVIDENCE_NORMALIZE --pr "$TARGET_PR" --apply --out "$RUNNER_TEMP/16p-write/evidence.json"
          b=$?
          node harness/scripts/guarded-github-write.mjs --operation TASK_MERGE --pr "$TARGET_PR" --apply --out "$RUNNER_TEMP/16p-write/merge.json"
          c=$?
          node harness/scripts/guarded-github-write.mjs --operation TASK_CLOSURE --pr "$TARGET_PR" --apply --out "$RUNNER_TEMP/16p-write/closure.json"
          d=$?
          set -e
          node --input-type=module -e '
            import fs from "node:fs";
            const base=process.env.RUNNER_TEMP+"/16p-write/";
            const names=["pr-create.json","evidence.json","merge.json","closure.json"];
            for(const name of names){
              const j=JSON.parse(fs.readFileSync(base+name,"utf8"));
              if(j.ok!==false||j.write_performed!==false||!/^BLOCK_|^HARD_STOP/.test(j.decision))
                throw Error("FAIL CLOSED not demonstrated: "+name);
              console.log("REAL GITHUB DENIAL VERIFIED",name,j.decision);
            }
          '
          if [[ "$a" -ne 3 || "$b" -ne 3 || "$c" -ne 3 || "$d" -ne 3 ]]; then exit 2; fi
      - name: Existing merged Task PR must be reused, never opened again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node harness/scripts/guarded-github-write.mjs --operation PR_CREATE --task T008 --out "$RUNNER_TEMP/16p-write/reuse-task.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          node --input-type=module -e '
            import fs from "node:fs";
            const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/16p-write/reuse-task.json","utf8"));
            if(d.decision!=="BLOCK_REUSE_EXISTING_TASK_PR"||d.write_performed!==false||
               !d.existing?.some(p=>p.number===386&&p.merged===true))
              throw Error("Historical Task #386 merged PR must block a new T008 PR");
            console.log("LIVE GitHub Task reuse PASS: T008 #386 already merged; no new PR created");
          '
      - name: Real #1 GitHub Task lifecycle source-to-evidence audit (not Closure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node harness/scripts/guarded-github-write.mjs --operation TASK_HISTORY_AUDIT --pr 386 --evidence-pr 387 --out "$RUNNER_TEMP/16p-write/task-history.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import {execFileSync} from "node:child_process";
            import {taskIdentityOfPr} from "./harness/scripts/task-pr-lifecycle.mjs";
            const gh=n=>JSON.parse(execFileSync("gh",["api","repos/"+process.env.GITHUB_REPOSITORY+"/pulls/"+n],{encoding:"utf8"}));
            if(taskIdentityOfPr(gh(386)).task_id!=="T008"||taskIdentityOfPr(gh(323)).task_id!=="T004"||taskIdentityOfPr(gh(404)).ok)
              throw Error("Real Task PR classification wrong");
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/16p-write/task-history.json"));
            if(!a.ok||a.status!=="PARTIAL_TWO_PR_HISTORY_AND_CLOSURE_PENDING"||a.complete_one_pr_e2e_verified||a.same_primary_pr||
               !a.source_merged||!a.evidence_merged||!a.verified_pr_merge_sequence||a.canonical_task_status!=="REVIEW"||a.canonical_evidence_count!==14)
              throw Error("Task #1 real GitHub receipt does not prove expected partial history");
            console.log("LIVE #1 PARTIAL: PR #386 merged -> #387 Evidence merged -> T008 REVIEW, 14 Evidence; NOT one-PR closure");
          '
      - name: Upload real GitHub prewrite denial receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 16p-guarded-prewrite-evidence
          path: ${{ runner.temp }}/16p-write/*.json
          if-no-files-found: warn
