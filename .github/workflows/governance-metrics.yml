name: GOV-REFORM-20261013 Weekly Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "31 1 * * 1"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect real GitHub histories (run ATTEMPTS + executed jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gov-reform"
          mkdir -p "$out"
          # Bounded observation window; no invented before/after efficacy claim.
          since="$(date -u -d '7 days ago' +%Y-%m-%d)"
          : > "$out/list.ndjson"
          for workflow in ci.yml codeql.yml; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100&created=%3E%3D$since" | \
              jq -sc '[.[] | .workflow_runs[]? | {id,name,event,headSha:.head_sha,headBranch:.head_branch,runAttempt:.run_attempt}] | .[]' >> "$out/list.ndjson"
          done
          jq -s '.' "$out/list.ndjson" > "$out/list.json"
          count="$(jq 'length' "$out/list.json")"
          if (( count > 750 )); then
            jq -n --arg since "$since" '{complete:false,window_start:$since,reason:"RUN_LIMIT_750",runs:[]}' > "$out/runs.json"
          else
            : > "$out/enriched.ndjson"
            while IFS= read -r row; do
              id="$(jq -r .id <<< "$row")"
              attempts="$(jq -r .runAttempt <<< "$row")"
              if ! [[ "$attempts" =~ ^[1-9][0-9]*$ ]] || (( attempts > 25 )); then
                echo "HARD_STOP: missing/excessive run attempts for $id" >&2
                exit 2
              fi
              : > "$out/jobs.ndjson"
              for (( a=1; a<=attempts; a++ )); do
                gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/$a/jobs?per_page=100" | \
                  jq -sc --argjson attempt "$a" '[.[] | .jobs[]? | {id,name,status,conclusion,attempt:$attempt}] | .[]' >> "$out/jobs.ndjson"
              done
              jq -s '.' "$out/jobs.ndjson" > "$out/jobs.json"
              jq -cn --argjson row "$row" --slurpfile jobs "$out/jobs.json" '$row + {jobs:$jobs[0]}' >> "$out/enriched.ndjson"
            done < "$out/list.ndjson"
            jq -s --arg since "$since" '{complete:true,window_start:$since,runs:.}' "$out/enriched.ndjson" > "$out/runs.json"
          fi
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,title,body,isDraft > "$out/open-prs.json"
      - name: Publish evidence-bound reform scorecard
        run: |
          node harness/scripts/governance-metrics.mjs --ref HEAD             --runs "$RUNNER_TEMP/gov-reform/runs.json" --run-limit 100000             --open-prs "$RUNNER_TEMP/gov-reform/open-prs.json"             --out "$RUNNER_TEMP/gov-reform/reform-metrics.json"
      - name: Upload weekly scorecard (NOT governance PASS)
        uses: actions/upload-artifact@v4
        with:
          name: gov-reform-weekly-metrics
          path: ${{ runner.temp }}/gov-reform/reform-metrics.json
          if-no-files-found: error
