    branches:
      - product/sprint-3.5-complex-intent-recovery-20261026
    paths:
      - .github/workflows/sp35-free-real-oidc-proof.yml
permissions:
  contents: read
jobs:
  real-free-receipt:
    if: github.repository == 'NFF98/appf2-build' && github.ref == 'refs/heads/product/sprint-3.5-complex-intent-recovery-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
