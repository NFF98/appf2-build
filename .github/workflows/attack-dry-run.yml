name: Governance Attack Dry-run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Required security and functional gates run before Human Final Ready.
  # Final Ready/BCE still govern merge; they must not suppress genuine test results.
  attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main-only merge provenance guard (PR tests never pre-blocked)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attack governance guardrails
        run: npm run dry-run:attack
      - name: Final Ready attestation AFTER real required checks (Ready PR only)
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh
