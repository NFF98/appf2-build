name: Governance Attack Dry-run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact-HEAD Final Ready preflight (NOT_READY fails, no full jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/scripts/run-final-ready-preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attack governance guardrails
        run: npm run dry-run:attack
