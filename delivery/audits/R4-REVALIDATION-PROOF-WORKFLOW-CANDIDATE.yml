name: Revalidation Proof (PROPOSED)
on:
  push:
    branches: [main]
    paths:
      - 'delivery/sprints/**'
      - 'delivery/backlog/**'
      - 'src/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  revalidation-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed refs/tags/v4 on 2026-10-11
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # reviewed refs/tags/v4 on 2026-10-11
        with:
          node-version: '22'
      - name: Install immutable dependencies
        run: npm ci
      - name: Verify exact Human-authorized Revalidation Task
        run: node harness/scripts/revalidation-proof-preflight.mjs
      - name: Governance Gate
        run: npm run gate
      - name: Execute exact mapped tests
        run: node harness/scripts/run-revalidation-tests.mjs --json-out /tmp/revalidation-executed-tests.json
      - name: Generate test proof manifest
        run: node harness/scripts/emit-revalidation-proof.mjs --results /tmp/revalidation-executed-tests.json --output /tmp/revalidation-proof.json
      - name: Attest proof artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed refs/tags/v4 on 2026-10-11
        with:
          subject-path: /tmp/revalidation-proof.json
